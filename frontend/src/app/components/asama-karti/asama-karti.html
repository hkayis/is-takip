<div class="kutu-ust">
  <h2>Aşama Dağılımı</h2>
  <span class="kutu-not">Devam Edenler</span>
  <ng-content />
</div>

@for (a of dagilim(); track a.kod) {
<div class="asama-satiri">
  <span class="asama-ad">{{ a.etiket }}</span>
  <div class="asama-yol">
    <div class="asama-cubuk" [style.width.%]="a.yuzde"></div>
  </div>
  <span class="asama-sayi">{{ a.sayi }}</span>
</div>
}
