<div class="login-page">
  <form class="login-card" (ngSubmit)="girisYap()">

    <div class="marka">
      <span class="marka-ikon">🗂️</span>
      <h1>{{title}}</h1>
      <p class="alt-baslik">İş takip ve raporlama</p>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Kullanıcı adı</mat-label>
      <input matInput name="username" autocomplete="username" autofocus
             [(ngModel)]="username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Şifre</mat-label>
      <input matInput name="password" autocomplete="current-password"
             [type]="sifreGorunur ? 'text' : 'password'"
             [(ngModel)]="password" />
      <button matIconButton matSuffix type="button"
              [attr.aria-label]="sifreGorunur ? 'Şifreyi gizle' : 'Şifreyi göster'"
              (click)="sifreGorunur = !sifreGorunur">
        <mat-icon>{{ sifreGorunur ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (hata) {
      <p class="hata">{{ hata }}</p>
    }

    <button matButton="filled" type="submit" class="giris-btn" [disabled]="yukleniyor">
      {{ yukleniyor ? 'Giriş yapılıyor…' : 'Giriş Yap' }}
    </button>

  </form>
</div>
