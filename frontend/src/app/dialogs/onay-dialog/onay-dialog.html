<h2 mat-dialog-title>{{ data.baslik }}</h2>

<mat-dialog-content>
  <p class="mesaj">{{ data.mesaj }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="hayir()">Vazgeç</button>
  <button matButton="filled" class="tehlike" (click)="evet()">{{ data.onayMetni }}</button>
</mat-dialog-actions>
